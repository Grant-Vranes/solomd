name: Build and Release

# 推送 tag（如 v4.14.5）或手动触发时，构建 Windows / macOS / Linux 三端安装包，
# 并上传到同名的 GitHub Release（默认草稿，确认无误后手动 Publish）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }}-${{ matrix.arch }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            curl \
            wget \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
            mcp-server/target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.target }}-cargo-

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # MCP sidecar 必须在 tauri build 之前就绪：
      # build.rs 编译期会校验 bundle.externalBin 指向的
      # binaries/solomd-mcp-<target>.exe 是否存在，
      # 而 beforeBundleCommand 在 cargo 编译之后才执行，来不及。
      - name: Build MCP sidecar
        run: bash scripts/build-mcp-sidecar.sh ${{ matrix.target }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'SoloMD ${{ github.ref_name }}'
          releaseBody: |
            ## SoloMD ${{ github.ref_name }}

            > ⭐ **Like SoloMD? [Star it on GitHub](https://github.com/zhitongblog/solomd)** — it's free, made by one developer, and stars are how other people find it.
            > 觉得好用？请[去 GitHub 点个 Star](https://github.com/zhitongblog/solomd) —— 免费开源、一个人维护，Star 能让更多人发现它。
            >
            > 📣 Wrote about SoloMD or recommended it? [Get listed as a promoter](https://solomd.app/promote) · 写过、推荐过 SoloMD？[登记成为推广者](https://solomd.app/zh/promote)

            ### What's new / 更新内容

            https://solomd.app/whats-new · [中文](https://solomd.app/zh/whats-new)

            ### Install / 安装

            - **macOS**: download `.dmg`, drag SoloMD to `/Applications`
            - **Windows**: download `.msi`. On first launch you may see "Windows protected your PC" → click **More info** → **Run anyway** (one-time, until SmartScreen reputation builds). 首次运行点 "更多信息" → "仍要运行" 即可
            - **Linux**: download `.AppImage` (`chmod +x` and run) or `.deb` / `.rpm`

            ### Verify / 校验

            The Windows builds are not code-signed yet, so Chrome's Enhanced
            Protection scans each new release and reports "No viruses detected"
            — that is a pass, not a warning. `SHA256SUMS.txt` is attached below
            if you want to verify the download yourself.

            Windows 版尚未代码签名，Chrome「增强保护」会扫描每个新版本并提示
            "未检测到病毒" —— 这是通过，不是警告。附件 `SHA256SUMS.txt` 可用于自行校验。

            🤖 Auto-built by GitHub Actions
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: solomd-mcp-${{ matrix.os }}-${{ matrix.arch }}
          path: app/src-tauri/binaries/solomd-mcp-*
